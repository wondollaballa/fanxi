[package]
name = "fanxi-launcher"
version = "0.1.0"
description = "Fanxi Launcher — a native Tauri desktop client for Fanxi"
authors = ["Fanxi contributors"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fanxi_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.0", features = ["full"] }
thiserror = "2.0.21"
chrono = "0.4.45"
libc = "0.2.191"
base64 = "0.22"
png = "0.18"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tauri-plugin-dialog = "2.8.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
