name: Fanxi

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Server tests
        run: python3 -m unittest discover -s server/tests -v
      - name: Syntax and installer checks
        run: |
          python3 -m compileall -q server/fanxi_server tools/make_brand_assets.py
          bash -n install.sh
          bash -n setup.command
          bash -n tools/install-source.sh
          sh -n scripts/launcher.sh
          sh -n scripts/dev.sh
          sh -n scripts/test.sh
